<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G7External Menu</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed header bar, left nav rail with hard edges, content grid of hairline panels, status strip at the bottom. Pure black, white ink, grey rules. */
:root{
  --bg:#000000; --panel:#070707; --raised:#0F0F0F; --control:#161616;
  --rule:#1F1F1F; --rule-strong:#2E2E2E;
  --ink:#FFFFFF; --ink-2:#A3A3A3; --ink-3:#5C5C5C;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:3px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.35;padding-block:0;padding-inline:0;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-rows:44px 1fr 28px;grid-template-columns:224px 1fr;height:100%;background:var(--bg);transform-origin:top left}
/* header */
.hdr{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--bg)}
.hdr .mark{width:34px;height:23px;display:block}
.hdr .wm{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.14em}
.hdr .wm span{color:var(--ink-3);font-weight:400}
.hdr .build{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em;padding-left:14px;border-left:1px solid var(--rule)}
.hdr .spacer{flex:1}
.hdr .ro{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.06em;display:flex;gap:16px}
.hdr .ro b{color:var(--ink);font-weight:500}
.hdr .dot{width:6px;height:6px;background:var(--ink);display:inline-block;margin-right:6px;vertical-align:1px}
/* nav */
.nav{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.nav .search{margin:14px 12px 8px;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--rule-strong);background:var(--control);border-radius:var(--r)}
.nav .search svg{flex:none;color:var(--ink-3)}
.nav .search input{flex:1;min-width:0;font-size:12px}
.nav .search input::placeholder{color:var(--ink-3)}
.nav .search kbd{font-family:var(--mono);font-size:9px;color:var(--ink-3);border:1px solid var(--rule-strong);padding:1px 4px;border-radius:2px}
.nav .sec{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--ink-3);padding:12px 16px 4px}
.nav .item{display:flex;align-items:center;gap:10px;height:34px;padding:0 14px;color:var(--ink-2);font-weight:500;border-left:2px solid transparent;width:100%;text-align:left;font-size:13px}
.nav .item svg{color:var(--ink-3)}
.nav .item:hover{color:var(--ink);background:var(--panel)}
.nav .item.on{color:var(--ink);border-left-color:var(--ink);background:var(--raised)}
.nav .item.on svg{color:var(--ink)}
.nav .item .n{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.nav .grow{flex:1}
.nav .me{position:relative;border-top:1px solid var(--rule);padding:12px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.nav .me:hover{background:var(--panel)}
.nav .me img{width:36px;height:36px;object-fit:cover;border:1px solid var(--rule-strong);filter:grayscale(1) contrast(1.15)}
.nav .me .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.nav .me .who b{font-weight:600;font-size:13px}
.nav .me .who i{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-3)}
.nav .me .st{margin-left:auto;width:6px;height:6px;background:var(--ink)}
.pop{position:absolute;left:12px;bottom:66px;width:200px;background:var(--raised);border:1px solid var(--rule-strong);border-radius:var(--r);padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.8);z-index:5}
.pop .ph{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-3);padding:6px 8px 4px}
.pop .pr{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;width:100%;text-align:left;color:var(--ink);border-radius:2px;font-weight:500}
.pop .pr:hover{background:var(--control)}
.pop .pr svg:first-child{color:var(--ink-2)}
.pop .pr .v{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.pop .pr.danger{color:var(--ink-2)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 20px;border-bottom:1px solid var(--rule);height:42px;flex:none;overflow-x:auto}
.tabs .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);padding:0 14px 13px 0;white-space:nowrap}
.tabs .tab{display:flex;align-items:center;gap:7px;padding:0 12px 12px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13px}
.tabs .tab svg{color:var(--ink-3)}
.tabs .tab:hover{color:var(--ink)}
.tabs .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .tab.on svg{color:var(--ink)}
.content{flex:1;overflow:auto;padding:18px 20px 24px;min-height:0}
.grid{display:grid;gap:14px;align-items:start}
.grid.c1{grid-template-columns:1fr}.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}
.grid+.grid{margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
.panel .ph{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.panel .ph svg{color:var(--ink-3)}
.panel .ph .cnt{margin-left:auto;color:var(--ink-3)}
.panel .pb{padding:2px 14px 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:5px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .lab{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .lt{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.row.on .lt{color:var(--ink)}
.row.dim .lt{color:var(--ink-3)}
.row .sub{font-size:11.5px;color:var(--ink-3)}
.row .ctl{display:flex;align-items:center;gap:8px;flex:none}
.row.dim .ctl{opacity:.45}
.row.hide{display:none}
/* controls */
.tg{width:36px;height:18px;border:1px solid var(--rule-strong);background:var(--control);border-radius:2px;position:relative;flex:none;transition:background .12s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink-3);transition:transform .12s,background .12s}
.tg.on{background:var(--ink);border-color:var(--ink)}
.tg.on::after{background:#000;transform:translateX(18px)}
.sl{display:flex;align-items:center;gap:10px}
.sl .v{font-family:var(--mono);font-size:11px;min-width:40px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:14px;background:transparent;cursor:pointer}
.sl input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--ink) 0 var(--p),var(--rule-strong) var(--p) 100%)}
.sl input[type=range]::-moz-range-track{height:2px;background:var(--rule-strong)}
.sl input[type=range]::-moz-range-progress{height:2px;background:var(--ink)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--ink);margin-top:-4px;border-radius:1px}
.sl input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--ink);border:0;border-radius:1px}
.sl.w150 input[type=range]{width:150px}.sl.w80 input[type=range]{width:80px}
.dd{position:relative}
.dd>button{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:104px;height:28px;padding:0 8px 0 10px;border:1px solid var(--rule-strong);background:var(--control);border-radius:var(--r);font-weight:500;font-size:12px}
.dd>button svg{color:var(--ink-3)}
.dd .menu{position:absolute;right:0;top:calc(100% + 4px);min-width:100%;background:var(--raised);border:1px solid var(--rule-strong);border-radius:var(--r);padding:4px;z-index:4;box-shadow:0 14px 30px rgba(0,0,0,.7)}
.dd .menu button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:2px;color:var(--ink-2);font-size:12px;white-space:nowrap}
.dd .menu button:hover{background:var(--control);color:var(--ink)}
.dd .menu button.sel{color:var(--ink)}
.key{font-family:var(--mono);font-size:11px;min-width:92px;height:28px;padding:0 10px;border:1px solid var(--rule-strong);background:var(--control);border-radius:var(--r);color:var(--ink-2);letter-spacing:.04em}
.key.listen{border-color:var(--ink);color:var(--ink);animation:blink 1s steps(2) infinite}
.key.set{color:var(--ink)}
@keyframes blink{50%{border-color:var(--rule-strong)}}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;width:76px;height:28px;border:1px solid var(--rule-strong);background:var(--control);border-radius:var(--r);color:var(--ink-3)}
.chip.HOLD{color:var(--ink);border-color:var(--ink-2)}
.chip.TOGGLE{background:var(--ink);color:#000;border-color:var(--ink)}
.btn{height:32px;padding:0 16px;border-radius:var(--r);font-weight:600;font-size:12px;border:1px solid var(--ink);background:var(--ink);color:#000}
.btn:hover{background:#e6e6e6}
.btn.ghost{background:var(--control);color:var(--ink-2);border-color:var(--rule-strong)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink-2)}
.btn.wide{width:100%;margin:8px 0}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--ink);border-radius:2px;color:var(--ink)}
.badge.soon{border-color:var(--rule-strong);color:var(--ink-3)}
.sw{width:18px;height:18px;border:1px solid var(--rule-strong);border-radius:2px;flex:none}
.seg{display:flex;gap:6px;padding:8px 0}
.seg button{flex:1;height:30px;border:1px solid var(--rule-strong);background:var(--control);color:var(--ink-2);border-radius:var(--r);font-weight:500;font-size:12px}
.seg button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.psearch{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;margin:8px 0;border:1px solid var(--rule-strong);background:var(--control);border-radius:var(--r)}
.psearch svg{color:var(--ink-3)}
.psearch input{flex:1;min-width:0;font-size:12px}
.psearch input::placeholder{color:var(--ink-3)}
.empty{padding:26px 0 18px;text-align:center;color:var(--ink-3);font-size:12px}
.empty.tall{padding:40px 0}
.lbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--ink-3);padding:12px 0 2px}
.more{color:var(--ink-3)}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px 0 4px}
.card{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 0;background:var(--raised);border:1px solid var(--rule);border-radius:var(--r)}
.card .bar{width:3px;align-self:stretch;background:var(--ink)}
.card .ct{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.card .ct b{font-weight:600;font-size:13px}
.card .ct span{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.card.hide{display:none}
.plist{display:flex;flex-direction:column;padding:4px 0}
.plist button{display:flex;align-items:center;gap:10px;height:34px;padding:0 6px;width:100%;text-align:left;border-radius:2px;color:var(--ink-2)}
.plist button:hover,.plist button.sel{background:var(--control);color:var(--ink)}
.plist button .d{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.plist button.hide{display:none}
.detail{padding:8px 0 4px}
.detail .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink-2)}
.detail .kv b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:11px}
.detail .acts{display:flex;gap:8px;padding-top:10px}
.sub2{padding:10px 0 2px}.sub2 b{display:block;font-weight:600}.sub2 span{font-size:11px;color:var(--ink-3)}
.layout{display:flex;gap:8px;justify-content:center;align-items:center;padding:24px 8px;background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);margin-top:8px}
.mon{width:100px;height:58px;border:1px solid var(--rule-strong);background:var(--raised);border-radius:2px;padding:6px 8px;display:flex;flex-direction:column;position:relative;text-align:left}
.mon b{font-size:12px}.mon span{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.mon.m-proj{border-color:var(--ink);border-width:2px}.mon.m-out{border-color:var(--ink-2);border-width:2px}.mon.m-in{border-color:#4a4a4a;border-width:2px}
.mon em{position:absolute;top:5px;right:5px;font-style:normal;font-family:var(--mono);font-size:7px;letter-spacing:.08em;padding:1px 4px;background:var(--ink);color:#000}
.legend{display:flex;gap:18px;padding:10px 2px 0;font-size:11px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}.legend u{width:7px;height:7px;display:inline-block}
.hint{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding:6px 0 0;letter-spacing:.04em}
/* status strip */
.status{grid-column:1/-1;border-top:1px solid var(--rule);display:flex;align-items:center;gap:18px;padding:0 16px;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;overflow:hidden;white-space:nowrap}
.status b{color:var(--ink);font-weight:500}
.status .sp{flex:1}
/* search results */
.results .hit{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px;width:100%;text-align:left;border-bottom:1px solid var(--rule);color:var(--ink)}
.results .hit:hover{background:var(--control)}
.results .hit .path{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin-left:auto;white-space:nowrap}
/* toast */
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#000;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:8px 14px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:44px auto 1fr 28px;height:auto;min-height:100%}
  .nav{border-right:0;border-bottom:1px solid var(--rule);flex-direction:row;flex-wrap:wrap;align-items:center;padding:6px 8px}
  .nav .search{margin:4px;flex:1 1 100%}
  .nav .sec{display:none}
  .nav .item{width:auto;height:30px;border-left:0;border-bottom:2px solid transparent;padding:0 10px}
  .nav .item.on{border-bottom-color:var(--ink);background:none}
  .nav .item .n{display:none}
  .nav .grow{display:none}
  .nav .me{border-top:0;width:auto;margin-left:auto;padding:4px}
  .nav .me .who,.nav .me .st{display:none}
  .pop{left:auto;right:8px;bottom:auto;top:100%}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  .content{overflow:visible}
  .hdr .ro{display:none}
}
</style>

/* ---------- control renderers ---------- */
function ctrl(r,k){
 switch(r.t){
  case 'toggle':return `<button class="tg ${val(k,r.v)?'on':''}" data-act="toggle" data-k="${h(k)}" role="switch" aria-checked="${val(k,r.v)}" aria-label="${h(r.l)}"></button>`;
  case 'slider':{const v=val(k,r.v);const p=((v-r.min)/(r.max-r.min))*100;return `<div class="sl ${r.w}"><span class="v">${v}${r.unit||''}</span><input type="range" id="${h(k)}" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" style="--p:${p}%" data-act="slider" data-k="${h(k)}" aria-label="${h(r.l)}"></div>`;}
  case 'select':return `<div class="dd" data-k="${h(k)}"><button data-act="dd" aria-haspopup="listbox">${h(val(k,r.v))}${ic('chev',13)}</button></div>`;
  case 'key':{const v=val(k,r.v);return `<button class="key ${v!=='None'?'set':''}" data-act="key" data-k="${h(k)}">${h(v)}</button>`;}
  case 'swatch':return `<button class="sw" data-act="swatch" data-k="${h(k)}" style="background:${h(val(k,r.v))}" aria-label="${h(r.l)}"></button>`;
  case 'text':return `<input type="text" id="${h(k)}" class="key" style="min-width:160px;text-align:left" placeholder="…" value="${h(val(k,r.v))}" data-act="text" data-k="${h(k)}">`;
 }
 return '';
}
function rowHtml(r,k){
 if(r.t==='button')return `<button class="btn ${r.kind==='primary'?'':'ghost'} wide" data-act="btn" data-l="${h(r.l)}">${h(r.l)}</button>`;
 if(r.t==='seg')return `<div class="seg" data-k="${h(k)}">${r.opts.map(o=>`<button class="${val(k,r.v)===o?'on':''}" data-act="seg" data-v="${h(o)}">${h(o)}</button>`).join('')}</div>`;
 const on=r.t==='toggle'&&val(k,r.v);
 const badge=r.badge?`<span class="badge ${r.badge==='Soon'?'soon':''}">${r.badge}</span>`:'';
 return `<div class="row ${on?'on':''} ${r.dim?'dim':''}" data-label="${h(r.l)}"><div class="lab"><div class="lt">${h(r.l)}${badge}</div>${r.desc?`<div class="sub">${h(r.desc)}</div>`:''}</div><div class="ctl">${r.more?`<span class="more">${ic('dots',14)}</span>`:''}${ctrl(r,k)}</div></div>`;
}
function panelHtml(p,page,tab){
 const rows=p.rows.map(r=>rowHtml(r,key(page,tab,p.title,r.l))).join('');
 return `<section class="panel"><div class="ph">${ic(p.icon,14)}<span>${h(p.title).toUpperCase()}</span><span class="cnt">${p.rows.length}</span></div><div class="pb">${rows}</div></section>`;
}

function countActive(p){let n=0;for(const k in S.vals){if(k.startsWith(p+'/')&&S.vals[k]===true)n++;}return n;}
function renderTabs(){
 const pg=PAGES[S.page];
 if(S.gq){$('#tabs').innerHTML=`<span class="crumb">SEARCH</span><span class="tab on">${ic('search',14)}<span>“${h(S.gq)}”</span></span>`;return;}
 if(pg.single){$('#tabs').innerHTML=`<span class="crumb">${S.page.toUpperCase()}</span>`;return;}
 const cur=S.tab[S.page]||Object.keys(pg.tabs)[0];
 $('#tabs').innerHTML=`<span class="crumb">${S.page.toUpperCase()} /</span>`+Object.entries(pg.tabs).map(([t,d])=>`<button class="tab ${t===cur?'on':''}" data-act="tab" data-t="${h(t)}">${ic(d.icon,14)}<span>${h(t)}</span></button>`).join('');
}
function renderContent(){
 const c=$('#content');
 if(S.gq){c.innerHTML=searchHtml(S.gq);return;}
 const pg=PAGES[S.page];
 if(pg.single){c.innerHTML=builders[pg.build]();return;}
 const tname=S.tab[S.page]||Object.keys(pg.tabs)[0];const tab=pg.tabs[tname];
 if(tab.build){c.innerHTML=builders[tab.build]();return;}
 c.innerHTML=`<div class="grid c${tab.cols}">${tab.panels.map(p=>panelHtml(p,S.page,tname)).join('')}</div>`;
}
function searchHtml(q){
 const ql=q.toLowerCase();const hits=[];
 for(const [p,pg] of Object.entries(PAGES)){if(!pg.tabs)continue;for(const [t,tab] of Object.entries(pg.tabs)){if(!tab.panels)continue;for(const pan of tab.panels)for(const r of pan.rows)if(r.l&&r.l.toLowerCase().includes(ql))hits.push({p,t,pan:pan.title,r});}}
 if(!hits.length)return `<div class="panel"><div class="empty tall">No function matches “${h(q)}”</div></div>`;
 return `<section class="panel results"><div class="ph">${ic('search',14)}<span>RESULTS</span><span class="cnt">${hits.length}</span></div><div class="pb">${hits.slice(0,40).map(x=>`<button class="hit" data-act="goto" data-p="${x.p}" data-t="${h(x.t)}" data-l="${h(x.r.l)}">${ic(PAGES[x.p].icon,14)}<span>${h(x.r.l)}</span><span class="path">${x.p.toUpperCase()} / ${h(x.t).toUpperCase()} / ${h(x.pan).toUpperCase()}</span></button>`).join('')}</div></section>`;
}
function renderStatus(){let n=0;for(const k in S.vals)if(S.vals[k]===true)n++;$('#activeCount').textContent=n;$('#cfgName').textContent=S.cfg;}
function render(all){if(all!==false)renderNav();renderTabs();renderContent();renderStatus();applyScale();save();}
function applyScale(){const s=val(key('Theme','Colors','Presets','Menu scale'),100);document.documentElement.style.setProperty('--zoom',s/100);$('#app').style.zoom=s/100;}

/* ---------- popover ---------- */
function closePop(){const p=$('.pop');if(p)p.remove();}
function openPop(){closePop();const me=$('.me');const pop=document.createElement('div');pop.className='pop';
 pop.innerHTML=`<div class="ph">SPIRTSY · LIFETIME</div>`+[['Language','globe','English'],['Scale','move',`${val(key('Theme','Colors','Presets','Menu scale'),100)}%`],['Menu style','sliders','Mono']].map(([l,i,v])=>`<button class="pr" data-act="poprow" data-l="${l}">${ic(i,14)}<span>${l}</span><span class="v">${v}</span>${ic('chevr',12)}</button>`).join('')+
 `<div class="pr">${ic('badge',14)}<span>Badge</span><span class="v"></span>${ctrl(T('Badge',true),'me/badge')}</div><button class="pr danger" data-act="unload">${ic('power',14)}<span>Unload</span>${ic('chevr',12)}</button>`;
 me.parentElement.appendChild(pop);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
 if(a==='page'){S.page=el.dataset.p;S.gq='';render();return;}
 if(a==='tab'){S.tab[S.page]=el.dataset.t;render(false);return;}
 if(a==='goto'){S.gq='';S.page=el.dataset.p;S.tab[S.page]=el.dataset.t;render();const row=[...document.querySelectorAll('.row')].find(r=>r.dataset.label===el.dataset.l);if(row){row.scrollIntoView({block:'center'});row.style.outline='1px solid var(--ink)';setTimeout(()=>row.style.outline='',1200);}return;}
 if(a==='toggle'){const k=el.dataset.k;S.vals[k]=!val(k,el.classList.contains('on'));el.classList.toggle('on',S.vals[k]);el.setAttribute('aria-checked',S.vals[k]);el.closest('.row')?.classList.toggle('on',S.vals[k]);renderStatus();renderNav();save();return;}
 if(a==='dd'){e.stopPropagation();const dd=el.parentElement;if(dd.querySelector('.menu')){closeMenus();return;}closeMenus();const k=dd.dataset.k;const r=findRow(k);const cur=val(k,r?r.v:'');const m=document.createElement('div');m.className='menu';m.setAttribute('role','listbox');m.innerHTML=(r?r.opts:[]).map(o=>`<button class="${o===cur?'sel':''}" data-act="ddpick" data-v="${h(o)}" role="option">${h(o)}</button>`).join('');dd.appendChild(m);return;}
 if(a==='ddpick'){const dd=el.closest('.dd');S.vals[dd.dataset.k]=el.dataset.v;dd.querySelector('button').innerHTML=h(el.dataset.v)+ic('chev',13);closeMenus();save();return;}
 if(a==='key'||a==='bindkey'){listen(el,a);return;}
 if(a==='chip'){const k=el.dataset.k;const b=S.binds[k]||{m:el.textContent.trim(),k:'None'};const order=['N/A','HOLD','TOGGLE'];b.m=order[(order.indexOf(b.m)+1)%3];S.binds[k]=b;el.className='chip '+(b.m==='N/A'?'':b.m);el.textContent=b.m;save();return;}
 if(a==='swatch'){const k=el.dataset.k;const steps=['#FFFFFF','#A3A3A3','#5C5C5C','#2E2E2E','#161616','#000000'];const cur=(val(k,el.style.background)||'').toUpperCase();const i=steps.findIndex(s=>cur.includes(s.toLowerCase().slice(1))||cur===s);S.vals[k]=steps[(i+1)%steps.length];el.style.background=S.vals[k];save();return;}
 if(a==='seg'){const k=el.parentElement.dataset.k;S.vals[k]=el.dataset.v;[...el.parentElement.children].forEach(b=>b.classList.toggle('on',b===el));save();return;}
 if(a==='btn'){const l=el.dataset.l;if(l==='Reset to defaults'){S.vals={};S.binds={};toast('SETTINGS RESET');render();return;}toast(l.toUpperCase());return;}
 if(a==='load'){S.cfg=el.dataset.c;toast('LOADED '+S.cfg.toUpperCase());render(false);return;}
 if(a==='selp'){S.sel=+el.dataset.i;render(false);return;}
 if(a==='track'){S.track=+el.dataset.i;S.playing=true;render(false);return;}
 if(a==='playpause'){S.playing=!S.playing;render(false);return;}
 if(a==='prev'||a==='next'){S.track=(S.track+(a==='next'?1:TRACKS.length-1))%TRACKS.length;S.playing=true;render(false);return;}
 if(a==='dmode'){S.dmode=el.dataset.v;render(false);return;}
 if(a==='mon'){const n=el.dataset.n;const m=S.dmode||'proj';S.monitors[n]=S.monitors[n]===m?'':m;render(false);return;}
 if(a==='me'){e.stopPropagation();$('.pop')?closePop():openPop();return;}
 if(a==='poprow'){toast(el.dataset.l.toUpperCase()+' — COMING SOON');return;}
 if(a==='unload'){closePop();toast('G7EXTERNAL UNLOADED');document.querySelector('.app').style.opacity='.35';setTimeout(()=>document.querySelector('.app').style.opacity='',900);return;}
});
document.addEventListener('input',e=>{
 const el=e.target;const a=el.dataset.act;if(!a)return;
 if(a==='slider'){const v=+el.value;S.vals[el.dataset.k]=v;el.style.setProperty('--p',((v-el.min)/(el.max-el.min))*100+'%');el.parentElement.querySelector('.v').textContent=v;if(el.dataset.k.endsWith('Menu scale'))applyScale();save();return;}
 if(a==='gq'){S.gq=el.value.trim();renderTabs();renderContent();document.querySelectorAll('.nav .item').forEach(b=>b.classList.toggle('on',!S.gq&&b.dataset.p===S.page));return;}
 if(a==='pq'){S.pq=el.value;document.querySelectorAll('.plist button').forEach((b,i)=>b.classList.toggle('hide',!PLAYERS[i][0].toLowerCase().includes(el.value.toLowerCase())));return;}
 if(a==='cq'){S.cq=el.value;const q=el.value.toLowerCase();document.querySelectorAll('.card').forEach((c,i)=>{const cf=CONFIGS[i];c.classList.toggle('hide',!(cf[0].includes(q)||cf[1].includes(q)));});return;}
 if(a==='text'){S.vals[el.dataset.k]=el.value;save();}
});
function findRow(k){const [p,t,pan,l]=k.split('/');const tab=PAGES[p]&&PAGES[p].tabs&&PAGES[p].tabs[t];const panels=tab?tab.panels:null;if(panels){for(const pn of panels)if(pn.title===pan)return pn.rows.find(r=>r.l===l);}
 if(p==='Players')return DD('Sort by','Distance',['Distance','Name','Session time']);return null;}
let listening=null;
function listen(el,kind){if(listening){listening.el.classList.remove('listen');listening.el.textContent=listening.prev;}listening={el,kind,k:el.dataset.k,prev:el.textContent};el.classList.add('listen');el.textContent='PRESS…';}
document.addEventListener('keydown',e=>{
 if(listening){e.preventDefault();const {el,kind,k,prev}=listening;listening=null;el.classList.remove('listen');
  let name=e.key==='Escape'?'None':e.key===' '?'Space':e.key.length===1?e.key.toUpperCase():e.key.replace('Arrow','');
  if(e.key==='Escape')name='None';
  el.textContent=name;el.classList.toggle('set',name!=='None');
  if(kind==='bindkey'){const b=S.binds[k]||{m:'N/A',k:'None'};b.k=name;S.binds[k]=b;el.closest('.row')?.classList.toggle('on',name!=='None');}else S.vals[k]=name;
  save();return;}
 if(e.key==='/'&&!e.target.matches('input')){e.preventDefault();$('#gq').focus();}
 if(e.key==='Escape'){if(e.target.matches('input')){e.target.blur();}closeMenus();closePop();}
});
document.addEventListener('mousedown',e=>{if(listening&&e.target!==listening.el){const {el,k,kind}=listening;listening=null;el.classList.remove('listen');const name='MOUSE'+(e.button+1);el.textContent=name;el.classList.add('set');if(kind==='bindkey'){const b=S.binds[k]||{m:'N/A',k:'None'};b.k=name;S.binds[k]=b;}else S.vals[k]=name;save();e.preventDefault();}});
document.addEventListener('contextmenu',e=>{if(listening)e.preventDefault();});

/* ---------- ambient readouts ---------- */
const t0=Date.now();
setInterval(()=>{const d=new Date();$('#clock').textContent=d.toTimeString().slice(0,8);const s=Math.floor((Date.now()-t0)/1000);$('#sess').textContent=[s/3600,s/60%60,s%60].map(n=>String(Math.floor(n)).padStart(2,'0')).join(':');$('#fps').textContent=140+Math.floor(Math.random()*5);$('#ping').textContent=19+Math.floor(Math.random()*4);},1000);
render();
</script>
</body>
</html>
